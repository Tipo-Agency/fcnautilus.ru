# ПРОСТАЯ РАБОЧАЯ КОНФИГУРАЦИЯ БЕЗ ЦИКЛОВ
# Скопируйте это в /etc/nginx/sites-available/new.fcnautilus.ru
# ЗАМЕНИТЕ путь в root на ваш реальный SERVER_PATH!

server {
    listen 80;
    listen [::]:80;
    server_name new.fcnautilus.ru;

    root /home/deploy/new.fcnautilus.ru;  # ← ЗАМЕНИТЕ НА ВАШ SERVER_PATH!
    index index.html;

    # Статические файлы
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html - явно, без циклов
    location = /index.html {
        try_files /index.html =404;
    }

    # Все остальное - через fallback
    location / {
        try_files $uri $uri/ @fallback;
    }

    # Fallback для SPA
    location @fallback {
        rewrite ^.*$ /index.html last;
    }
}
