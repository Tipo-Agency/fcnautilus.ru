# БЫСТРОЕ ИСПРАВЛЕНИЕ - Добавить прокси для /api/webhook
# Скопируйте этот блок в ваш /etc/nginx/sites-available/fcnautilus.ru
# ВАЖНО: Добавьте ПЕРЕД location / (более специфичные location должны быть выше)

# Прокси для webhook 1С (чтобы избежать CORS) - ВАЖНО: должен быть ПЕРЕД location /
location /api/webhook {
    proxy_pass https://cloud.1c.fitness/api/hs/lead/Webhook/6538ea95-c58a-45bf-a73d-844677185d8e;
    proxy_http_version 1.1;
    proxy_method POST;
    proxy_set_header Host cloud.1c.fitness;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Content-Type application/json;
    proxy_set_header Accept application/json;
    proxy_buffering off;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    
    # Разрешаем все методы
    limit_except GET POST OPTIONS {
        deny all;
    }
}
