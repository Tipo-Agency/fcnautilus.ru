name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Check build output
        run: |
          echo "=== Build output structure ==="
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder was not created!"
            exit 1
          fi
          echo "Contents of dist folder:"
          ls -la dist/
          echo ""
          echo "Total files:"
          find dist -type f | wc -l
          echo ""
          echo "File sizes:"
          du -sh dist/*
      
      - name: Deploy to server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "dist/*"
          target: ${{ secrets.SERVER_PATH }}
          strip_components: 1
          rm: true
          debug: true
        continue-on-error: false
      
      - name: Run post-deploy commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          debug: true
          script: |
            echo "=== Post-deploy check ==="
            cd ${{ secrets.SERVER_PATH }}
            echo "Current directory: $(pwd)"
            echo ""
            echo "Files in deployment directory:"
            ls -la
            echo ""
            echo "Checking index.html:"
            if [ -f "index.html" ]; then
              echo "✅ index.html exists"
              head -5 index.html
            else
              echo "❌ ERROR: index.html not found!"
              exit 1
            fi
            echo ""
            echo "Total files deployed:"
            find . -type f | wc -l
            echo ""
            echo "Setting correct permissions:"
            chmod -R 755 .
            chown -R www-data:www-data . 2>/dev/null || chown -R nginx:nginx . 2>/dev/null || echo "Could not change ownership"
            echo ""
            echo "=== NGINX DIAGNOSTICS ==="
            echo ""
            echo "1. Current nginx config for new.fcnautilus.ru:"
            if [ -f "/etc/nginx/sites-available/new.fcnautilus.ru" ]; then
              cat /etc/nginx/sites-available/new.fcnautilus.ru
            else
              echo "❌ Config file not found at /etc/nginx/sites-available/new.fcnautilus.ru"
              echo "Checking sites-enabled:"
              ls -la /etc/nginx/sites-enabled/ | grep new.fcnautilus.ru || echo "No symlink found"
            fi
            echo ""
            echo "2. Root path from config:"
            ROOT_PATH=$(grep -E "^\s*root\s+" /etc/nginx/sites-available/new.fcnautilus.ru 2>/dev/null | head -1 | awk '{print $2}' | tr -d ';')
            if [ -n "$ROOT_PATH" ]; then
              echo "   Root: $ROOT_PATH"
              echo "   Current SERVER_PATH: ${{ secrets.SERVER_PATH }}"
              if [ "$ROOT_PATH" != "${{ secrets.SERVER_PATH }}" ]; then
                echo "   ⚠️  WARNING: Root path in nginx config ($ROOT_PATH) does not match SERVER_PATH (${{ secrets.SERVER_PATH }})!"
              fi
              if [ -d "$ROOT_PATH" ]; then
                echo "   ✅ Root directory exists"
                ls -la "$ROOT_PATH" | head -10
              else
                echo "   ❌ Root directory does NOT exist: $ROOT_PATH"
              fi
            else
              echo "   ❌ Could not extract root from config"
            fi
            echo ""
            echo "3. Nginx syntax check:"
            nginx -t 2>&1 || echo "⚠️  Nginx config test failed"
            echo ""
            echo "4. Last nginx errors:"
            tail -10 /var/log/nginx/error.log 2>/dev/null || echo "Could not read error log"
            echo ""
            echo "✅ Deployment completed successfully!"
            echo ""
            echo "⚠️  IMPORTANT: If you see errors above, fix nginx configuration!"
            echo "   Root path in nginx MUST match SERVER_PATH: ${{ secrets.SERVER_PATH }}"
