name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Check build output
        run: |
          echo "=== Build output structure ==="
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder was not created!"
            exit 1
          fi
          echo "Contents of dist folder:"
          ls -la dist/
          echo ""
          echo "Total files:"
          find dist -type f | wc -l
          echo ""
          echo "File sizes:"
          du -sh dist/*
      
      - name: Deploy to server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "dist/*"
          target: ${{ secrets.SERVER_PATH }}
          strip_components: 1
          rm: true
          debug: true
        continue-on-error: false
      
      - name: Run post-deploy commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          debug: true
          script: |
            echo "=== Post-deploy check ==="
            cd ${{ secrets.SERVER_PATH }}
            echo "Current directory: $(pwd)"
            echo ""
            echo "Files in deployment directory:"
            ls -la
            echo ""
            echo "Checking index.html:"
            if [ -f "index.html" ]; then
              echo "✅ index.html exists"
              head -5 index.html
            else
              echo "❌ ERROR: index.html not found!"
              exit 1
            fi
            echo ""
            echo "Total files deployed:"
            find . -type f | wc -l
            echo ""
            echo "Setting correct permissions:"
            chmod -R 755 .
            chown -R www-data:www-data . 2>/dev/null || chown -R nginx:nginx . 2>/dev/null || echo "Could not change ownership"
            echo ""
            echo "Checking nginx configuration:"
            if command -v nginx &> /dev/null; then
              nginx -t 2>&1 || echo "⚠️  Nginx config test failed - check manually"
            fi
            echo ""
            echo "✅ Deployment completed successfully!"
            echo ""
            echo "⚠️  IMPORTANT: Make sure nginx is configured correctly!"
            echo "   Check nginx.conf.example in the repository for reference"
            echo "   Key requirement: location / { try_files \$uri \$uri/ /index.html; }"
