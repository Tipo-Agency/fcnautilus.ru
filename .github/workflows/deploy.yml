name: Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Check build output
        run: |
          echo "=== Build output structure ==="
          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder was not created!"
            exit 1
          fi
          echo "Contents of dist folder:"
          ls -la dist/
          echo ""
          echo "Total files:"
          find dist -type f | wc -l
          echo ""
          echo "File sizes:"
          du -sh dist/*
      
      - name: Deploy to server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "dist/*"
          target: ${{ secrets.SERVER_PATH }}
          strip_components: 1
          rm: true
          debug: true
        continue-on-error: false
      
      - name: Run post-deploy commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          debug: true
          script: |
            echo "=== Post-deploy check ==="
            cd ${{ secrets.SERVER_PATH }}
            echo "Current directory: $(pwd)"
            echo ""
            echo "Files in deployment directory:"
            ls -la
            echo ""
            echo "Checking index.html:"
            if [ -f "index.html" ]; then
              echo "✅ index.html exists"
              head -5 index.html
            else
              echo "❌ ERROR: index.html not found!"
              exit 1
            fi
            echo ""
            echo "Total files deployed:"
            find . -type f | wc -l
            echo ""
            echo "Setting correct permissions:"
            chmod -R 755 .
            chown -R www-data:www-data . 2>/dev/null || chown -R nginx:nginx . 2>/dev/null || echo "Could not change ownership"
            echo ""
            echo "=== AUTO-CONFIGURE NGINX ==="
            echo ""
            
            # Определяем имя конфига (проверяем все возможные варианты)
            NGINX_CONFIG=""
            # Проверяем sites-available
            if [ -f "/etc/nginx/sites-available/fcnautilus.ru" ]; then
              NGINX_CONFIG="/etc/nginx/sites-available/fcnautilus.ru"
            elif [ -f "/etc/nginx/sites-available/new.fcnautilus.ru" ]; then
              NGINX_CONFIG="/etc/nginx/sites-available/new.fcnautilus.ru"
            # Проверяем conf.d
            elif [ -f "/etc/nginx/conf.d/fcnautilus.ru.conf" ]; then
              NGINX_CONFIG="/etc/nginx/conf.d/fcnautilus.ru.conf"
            elif [ -f "/etc/nginx/conf.d/new.fcnautilus.ru.conf" ]; then
              NGINX_CONFIG="/etc/nginx/conf.d/new.fcnautilus.ru.conf"
            # Проверяем основной конфиг
            elif [ -f "/etc/nginx/nginx.conf" ]; then
              NGINX_CONFIG="/etc/nginx/nginx.conf"
            fi
            
            # Если не нашли, ищем все конфиги с fcnautilus в имени
            if [ -z "$NGINX_CONFIG" ]; then
              echo "⚠️  Standard config files not found, searching for fcnautilus configs..."
              POSSIBLE_CONFIG=$(find /etc/nginx -name "*fcnautilus*" -type f 2>/dev/null | head -1)
              if [ -n "$POSSIBLE_CONFIG" ]; then
                NGINX_CONFIG="$POSSIBLE_CONFIG"
                echo "   Found: $NGINX_CONFIG"
              fi
            fi
            
            if [ -n "$NGINX_CONFIG" ]; then
              echo "✅ Found nginx config: $NGINX_CONFIG"
              
              # Проверяем и обновляем root путь
              CURRENT_ROOT=$(grep -E "^\s*root\s+" "$NGINX_CONFIG" 2>/dev/null | head -1 | awk '{print $2}' | tr -d ';')
              SERVER_PATH="${{ secrets.SERVER_PATH }}"
              
              if [ "$CURRENT_ROOT" != "$SERVER_PATH" ]; then
                echo "⚠️  Root path mismatch. Current: $CURRENT_ROOT, Expected: $SERVER_PATH"
                echo "   Updating root path in nginx config..."
                sudo sed -i "s|root\s*.*;|root $SERVER_PATH;|" "$NGINX_CONFIG"
                echo "   ✅ Root path updated"
              fi
              
              # ПЕРВОЕ: Настраиваем обработку PHP для /api/webhook.php
              if ! grep -qE "location\s*~\s*\^/api/.*\.php\$" "$NGINX_CONFIG"; then
                echo "⚠️  PHP processing for /api/*.php not found. Adding it..."
                
                # Определяем PHP-FPM сокет (проверяем разные версии)
                PHP_FPM_SOCKET=""
                for php_version in php8.3-fpm php8.2-fpm php8.1-fpm php8.0-fpm php7.4-fpm; do
                  if [ -S "/var/run/php/${php_version}.sock" ]; then
                    PHP_FPM_SOCKET="/var/run/php/${php_version}.sock"
                    echo "   Found PHP-FPM socket: $PHP_FPM_SOCKET"
                    break
                  fi
                done
                
                # Если не нашли, пробуем стандартный путь
                if [ -z "$PHP_FPM_SOCKET" ]; then
                  PHP_FPM_SOCKET="unix:/var/run/php/php8.1-fpm.sock"
                  echo "   Using default PHP-FPM socket: $PHP_FPM_SOCKET"
                fi
                
                # Создаем блок для обработки PHP
                sudo printf '%s\n' \
                  '    # PHP обработка для /api/*.php - ВАЖНО: должен быть ПЕРЕД location /' \
                  '    location ~ ^/api/.*\.php$ {' \
                  '        fastcgi_pass '"$PHP_FPM_SOCKET"';' \
                  '        fastcgi_index index.php;' \
                  '        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;' \
                  '        include fastcgi_params;' \
                  '        add_header '\''Access-Control-Allow-Origin'\'' '\''*'\'' always;' \
                  '        add_header '\''Access-Control-Allow-Methods'\'' '\''POST, OPTIONS'\'' always;' \
                  '        add_header '\''Access-Control-Allow-Headers'\'' '\''Content-Type'\'' always;' \
                  '        if ($request_method = '\''OPTIONS'\'') {' \
                  '            add_header '\''Access-Control-Allow-Origin'\'' '\''*'\'' always;' \
                  '            add_header '\''Access-Control-Allow-Methods'\'' '\''POST, OPTIONS'\'' always;' \
                  '            add_header '\''Access-Control-Allow-Headers'\'' '\''Content-Type'\'' always;' \
                  '            add_header '\''Access-Control-Max-Age'\'' 1728000;' \
                  '            add_header '\''Content-Type'\'' '\''text/plain; charset=utf-8'\'';' \
                  '            add_header '\''Content-Length'\'' 0;' \
                  '            return 204;' \
                  '        }' \
                  '    }' \
                  '' > /tmp/nginx_php_block.txt
                
                # Находим location / и вставляем ПЕРЕД ним
                LOCATION_LINE=$(grep -n "location /" "$NGINX_CONFIG" | head -1 | cut -d: -f1)
                if [ -n "$LOCATION_LINE" ]; then
                  echo "   Found 'location /' at line $LOCATION_LINE - inserting PHP block before it..."
                  sudo awk -v line="$LOCATION_LINE" -v file="/tmp/nginx_php_block.txt" '
                    NR == line {
                      while ((getline < file) > 0) print
                      close(file)
                    }
                    {print}
                  ' "$NGINX_CONFIG" > /tmp/nginx_config_new.txt
                  sudo mv /tmp/nginx_config_new.txt "$NGINX_CONFIG"
                  echo "   ✅ PHP processing block added"
                else
                  echo "   ⚠️  Could not find 'location /' to insert PHP block"
                fi
                
                sudo rm -f /tmp/nginx_php_block.txt
              else
                echo "   ✅ PHP processing for /api/*.php already configured"
              fi
              
              # ВТОРОЕ: Проверяем наличие прокси для /api/webhook (проверяем оба варианта: с = и без)
              if ! grep -qE "location\s*=?\s*/api/webhook" "$NGINX_CONFIG"; then
                echo "⚠️  Proxy block for /api/webhook not found. Adding it..."
                
                # Сначала проверяем, есть ли server блок
                if ! grep -qE "^\s*server\s*{" "$NGINX_CONFIG"; then
                  echo "   ⚠️  No server block found in config. This might be a main nginx.conf file."
                  echo "   Please ensure the proxy block is added to the correct server block manually."
                fi
                
                # Создаем прокси блок (используем printf вместо heredoc для совместимости с YAML)
                sudo printf '%s\n' \
                  '    # Прокси для webhook 1С (чтобы избежать CORS) - ВАЖНО: должен быть ПЕРЕД location /' \
                  '    location = /api/webhook {' \
                  '        if ($request_method = '\''OPTIONS'\'') {' \
                  '            add_header '\''Access-Control-Allow-Origin'\'' '\''*'\'' always;' \
                  '            add_header '\''Access-Control-Allow-Methods'\'' '\''POST, OPTIONS'\'' always;' \
                  '            add_header '\''Access-Control-Allow-Headers'\'' '\''Content-Type'\'' always;' \
                  '            add_header '\''Access-Control-Max-Age'\'' 1728000;' \
                  '            add_header '\''Content-Type'\'' '\''text/plain; charset=utf-8'\'';' \
                  '            add_header '\''Content-Length'\'' 0;' \
                  '            return 204;' \
                  '        }' \
                  '        proxy_pass https://cloud.1c.fitness/api/hs/lead/Webhook/6538ea95-c58a-45bf-a73d-844677185d8e;' \
                  '        proxy_set_header Host cloud.1c.fitness;' \
                  '        proxy_set_header X-Real-IP $remote_addr;' \
                  '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
                  '        proxy_set_header X-Forwarded-Proto $scheme;' \
                  '        proxy_buffering off;' \
                  '        proxy_request_buffering off;' \
                  '        proxy_ssl_server_name on;' \
                  '        proxy_ssl_verify off;' \
                  '        proxy_http_version 1.1;' \
                  '        add_header '\''Access-Control-Allow-Origin'\'' '\''*'\'' always;' \
                  '        add_header '\''Access-Control-Allow-Methods'\'' '\''POST, OPTIONS'\'' always;' \
                  '        add_header '\''Access-Control-Allow-Headers'\'' '\''Content-Type'\'' always;' \
                  '    }' \
                  '' > /tmp/nginx_proxy_block.txt
                
                echo "   Created proxy block file. Verifying..."
                echo "   First 5 lines of proxy block:"
                head -5 /tmp/nginx_proxy_block.txt
                
                # Находим строку с location / и вставляем ПЕРЕД ней
                # Используем более надежный метод - находим номер строки и вставляем перед ней
                LOCATION_LINE=$(grep -n "location /" "$NGINX_CONFIG" | head -1 | cut -d: -f1)
                
                if [ -n "$LOCATION_LINE" ]; then
                  echo "   Found 'location /' at line $LOCATION_LINE - inserting before it..."
                  # Используем awk для вставки перед указанной строкой
                  sudo awk -v line="$LOCATION_LINE" -v file="/tmp/nginx_proxy_block.txt" '
                    NR == line {
                      while ((getline < file) > 0) print
                      close(file)
                    }
                    {print}
                  ' "$NGINX_CONFIG" > /tmp/nginx_config_new.txt
                  sudo mv /tmp/nginx_config_new.txt "$NGINX_CONFIG"
                elif grep -q "location / {" "$NGINX_CONFIG"; then
                  echo "   Found 'location / {' - inserting before it using sed..."
                  sudo sed -i '/location \/ {/r /tmp/nginx_proxy_block.txt' "$NGINX_CONFIG"
                elif grep -qE "^\s*location / {" "$NGINX_CONFIG"; then
                  echo "   Found '^\s*location / {' - inserting before it..."
                  sudo sed -i '/^\s*location \/ {/r /tmp/nginx_proxy_block.txt' "$NGINX_CONFIG"
                else
                  echo "   ⚠️  No 'location /' found - inserting before server block closing brace..."
                  # Ищем последнюю закрывающую скобку server блока
                  sudo sed -i '0,/^[[:space:]]*}/{ /^[[:space:]]*}/r /tmp/nginx_proxy_block.txt }' "$NGINX_CONFIG"
                fi
                
                sudo rm -f /tmp/nginx_proxy_block.txt
                echo "   ✅ Proxy block added"
                
                # Проверяем что блок действительно добавился
                sleep 1
                if grep -qE "location\s*=?\s*/api/webhook" "$NGINX_CONFIG"; then
                  echo "   ✅ Verified: proxy block found in config"
                  echo "   Showing lines around /api/webhook:"
                  grep -A 20 -B 2 "location.*/api/webhook" "$NGINX_CONFIG" | head -25
                  
                  # КРИТИЧНО: Проверяем, что блок находится ПЕРЕД location /
                  API_LINE=$(grep -n "location.*/api/webhook" "$NGINX_CONFIG" | head -1 | cut -d: -f1)
                  LOCATION_LINE=$(grep -n "location /" "$NGINX_CONFIG" | head -1 | cut -d: -f1)
                  if [ -n "$API_LINE" ] && [ -n "$LOCATION_LINE" ]; then
                    if [ "$API_LINE" -lt "$LOCATION_LINE" ]; then
                      echo "   ✅ Proxy block is correctly placed BEFORE location /"
                    else
                      echo "   ⚠️  WARNING: Proxy block is AFTER location / - this will cause 405 errors!"
                      echo "   Removing incorrect block and re-adding..."
                      # Удаляем неправильно размещенный блок
                      sudo sed -i '/location.*\/api\/webhook/,/^[[:space:]]*}/d' "$NGINX_CONFIG"
                      # Добавляем снова перед location /
                      LOCATION_LINE=$(grep -n "location /" "$NGINX_CONFIG" | head -1 | cut -d: -f1)
                      sudo awk -v line="$LOCATION_LINE" -v file="/tmp/nginx_proxy_block_fix.txt" '
                        BEGIN { while ((getline < file) > 0) block = block $0 "\n"; close(file) }
                        NR == line { print block }
                        {print}
                      ' "$NGINX_CONFIG" > /tmp/nginx_config_fixed.txt
                      sudo mv /tmp/nginx_config_fixed.txt "$NGINX_CONFIG"
                    fi
                  fi
                else
                  echo "   ❌ ERROR: proxy block NOT found after insertion!"
                  echo "   Current config content around location blocks:"
                  grep -B 5 -A 10 "location" "$NGINX_CONFIG" | head -30
                fi
              else
                echo "   ✅ Proxy block for /api/webhook already exists"
                echo "   Showing existing proxy block:"
                grep -A 15 "location.*/api/webhook" "$NGINX_CONFIG" | head -20
                
                # Проверяем порядок блоков
                API_LINE=$(grep -n "location.*/api/webhook" "$NGINX_CONFIG" | head -1 | cut -d: -f1)
                LOCATION_LINE=$(grep -n "location /" "$NGINX_CONFIG" | head -1 | cut -d: -f1)
                if [ -n "$API_LINE" ] && [ -n "$LOCATION_LINE" ]; then
                  if [ "$API_LINE" -lt "$LOCATION_LINE" ]; then
                    echo "   ✅ Proxy block is correctly placed BEFORE location /"
                  else
                    echo "   ⚠️  WARNING: Proxy block is AFTER location / - this will cause 405 errors!"
                    echo "   Please fix the order manually or re-run deployment."
                  fi
                fi
              fi
              
              # Проверяем синтаксис nginx
              echo ""
              echo "Testing nginx configuration..."
              if sudo nginx -t; then
                echo "✅ Nginx config is valid. Reloading nginx..."
                sudo systemctl reload nginx
                echo "✅ Nginx reloaded successfully"
              else
                echo "❌ Nginx config test failed! Check the config manually."
              fi
              
            else
              echo "⚠️  Nginx config not found. Please configure nginx manually."
            fi
            
            echo ""
            echo "=== NGINX DIAGNOSTICS ==="
            echo ""
            echo "1. Current nginx config:"
            if [ -n "$NGINX_CONFIG" ]; then
              cat "$NGINX_CONFIG"
            else
              echo "❌ Config file not found"
            fi
            echo ""
            echo "2. Root path from config:"
            ROOT_PATH=$(grep -E "^\s*root\s+" /etc/nginx/sites-available/new.fcnautilus.ru 2>/dev/null | head -1 | awk '{print $2}' | tr -d ';')
            if [ -n "$ROOT_PATH" ]; then
              echo "   Root: $ROOT_PATH"
              echo "   Current SERVER_PATH: ${{ secrets.SERVER_PATH }}"
              if [ "$ROOT_PATH" != "${{ secrets.SERVER_PATH }}" ]; then
                echo "   ⚠️  WARNING: Root path in nginx config ($ROOT_PATH) does not match SERVER_PATH (${{ secrets.SERVER_PATH }})!"
              fi
              if [ -d "$ROOT_PATH" ]; then
                echo "   ✅ Root directory exists"
                ls -la "$ROOT_PATH" | head -10
              else
                echo "   ❌ Root directory does NOT exist: $ROOT_PATH"
              fi
            else
              echo "   ❌ Could not extract root from config"
            fi
            echo ""
            echo "3. Nginx syntax check:"
            nginx -t 2>&1 || echo "⚠️  Nginx config test failed"
            echo ""
            echo "4. Last nginx errors:"
            tail -10 /var/log/nginx/error.log 2>/dev/null || echo "Could not read error log"
            echo ""
            echo "✅ Deployment completed successfully!"
            echo ""
            echo "⚠️  IMPORTANT: If you see errors above, fix nginx configuration!"
            echo "   Root path in nginx MUST match SERVER_PATH: ${{ secrets.SERVER_PATH }}"
